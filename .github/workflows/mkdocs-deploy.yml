name: Deploy MkDocs Site

on:
  push:
    branches:
      - main # Triggers deployment on push to the main branch

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper gh-pages branch handling
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Documentation Dependencies
        run: |
          pip install --upgrade pip
          pip install .[docu]
      - name: Build MkDocs Site
        run: mkdocs build
      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use --force to ensure clean deployment in CI/CD, as the gh-pages branch is auto-generated
          mkdocs gh-deploy --force